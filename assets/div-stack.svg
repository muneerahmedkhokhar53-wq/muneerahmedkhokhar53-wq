<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="TECH STACK">
<style>.m{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#19E3D1"/><stop offset="1" stop-color="#19E3D1" stop-opacity="0"/></linearGradient>
<filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<path d="M0 32H185" stroke="#14586B" stroke-width="1"/>
<path d="M185 32H1200" stroke="url(#ln)" stroke-width="2"/>
<path d="M2 12V2H12M2 52V62H12" stroke="#19E3D1" stroke-width="2" fill="none"/>
<rect x="16" y="20" width="10" height="24" fill="#FF7A3D"/>
<text x="38" y="39" class="m" font-size="18" font-weight="700" letter-spacing="3" fill="#E6F4F7">TECH STACK</text>
<circle r="4" cy="32" fill="#FF7A3D" filter="url(#gl)"><animate attributeName="cx" from="185" to="1200" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="3.2s" repeatCount="indefinite"/></circle>
<text x="1196" y="14" text-anchor="end" class="m" font-size="11" letter-spacing="2" fill="#4FB3BF">USED IN MY PROJECTS</text>
</svg>